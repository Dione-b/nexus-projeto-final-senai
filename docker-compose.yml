# Banco de dados do Nexus Atendimento.
# Um único PostgreSQL guarda os dados transacionais e os vetoriais (pgvector),
# conforme as seções 2, 3 e 8 do README.
#
# Uso: docker compose up -d
# As credenciais vêm do arquivo .env (veja o .env.example).

services:
  db:
    image: pgvector/pgvector:0.8.0-pg16
    container_name: nexus-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexus}
      POSTGRES_USER: ${DB_USER:-nexus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexus}
    ports:
      # Exposto apenas na máquina local.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - nexus_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexus_db_data:
